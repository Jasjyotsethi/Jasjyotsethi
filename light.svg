    <text x="651" y="121" fill="#006e9f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2.2">ROBOTICS + AI <tspan fill="#6a8094">/ STUDENT INTERESTS</tspan></text>
    <text x="646" y="190" fill="#142337" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="58" font-weight="650" letter-spacing="-2">Jasjyot</text>
    <text x="651" y="226" fill="#3d5368" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Autonomous systems, embedded robotics</text>
    <text x="651" y="252" fill="#3d5368" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">and software development.</text>
