<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">Jasjyot | Robotics + AI</title>
  <desc id="desc">Light engineering banner with a blue maze route and abstract robot illustration beside Jasjyot's robotics, autonomous systems, and software interests.</desc>
  <defs>
    <linearGradient id="bgL" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f9fd"/><stop offset="1" stop-color="#eaf2fb"/></linearGradient>
    <linearGradient id="blueL" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#007fba"/><stop offset="1" stop-color="#365fe8"/></linearGradient>
    <pattern id="gridL" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#456885" stroke-opacity=".1" stroke-width="1"/></pattern>
    <filter id="glowL" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="frameL"><rect x="18" y="18" width="1164" height="374" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#frameL)">
