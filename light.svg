    <circle cx="410" cy="238" r="93" fill="none" stroke="#365fe8" stroke-opacity=".23" stroke-dasharray="2 9"><animateTransform attributeName="transform" type="rotate" from="0 410 238" to="360 410 238" dur="34s" repeatCount="indefinite"/></circle>
