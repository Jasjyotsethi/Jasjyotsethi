      <circle cx="-16" cy="-3" r="5" fill="#087eaf" stroke="none" filter="url(#glowL)"/><circle cx="16" cy="-3" r="5" fill="#087eaf" stroke="none" filter="url(#glowL)"/>
      <path d="M-13 18Q0 28 13 18" fill="none" stroke="#087eaf" stroke-linecap="round"/><rect x="-28" y="38" width="56" height="28" rx="8" fill="#f7fbff"/><path d="M-19 66V74M19 66V74"/>
