<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">Jasjyot — robotics and software engineering profile banner</title>
  <desc id="desc">A light editorial engineering banner with an abstract robot and maze-inspired route on the left and concise profile details on the right.</desc>
