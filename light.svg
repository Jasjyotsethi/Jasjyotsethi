    <rect x="18" y="18" width="1164" height="374" fill="url(#gridL)"/>
    <path d="M605 18V392" stroke="#344f68" stroke-opacity=".2"/><path d="M18 83H1182" stroke="#344f68" stroke-opacity=".18"/>
    <circle cx="49" cy="51" r="4" fill="#d9485d"/><circle cx="65" cy="51" r="4" fill="#bd821c"/><circle cx="81" cy="51" r="4" fill="#007fba"/>
    <text x="104" y="56" fill="#3c5369" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.6">FIELD NOTES <tspan fill="#70859a">/ ROBOTICS + AI</tspan></text>
    <text x="52" y="113" fill="#006e9f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="2">NAVIGATION STUDY <tspan fill="#71849b">· ABSTRACT DIAGRAM</tspan></text>
    <g fill="none" stroke="#63778b" stroke-opacity=".58" stroke-width="2">
      <path d="M66 147H167V186H119V225H205V264H153V303H250V344"/><path d="M167 147H263V186H227M205 225H290V264H252M250 303H328V344"/><path d="M66 147V225M119 186V264M153 264V303M263 147V170M290 225V246"/>
    </g>
    <path d="M81 326V204H153V285H205V243H275" fill="none" stroke="url(#blueL)" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 8" filter="url(#glowL)">
      <animate attributeName="stroke-dashoffset" values="0;-52" dur="5.5s" repeatCount="indefinite"/>
    </path>
