    <text x="651" y="344" fill="#3d5368" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Navigation  /  sensing  /  computer vision</text>
    <text x="651" y="366" fill="#647d92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.4">BUILD · DOCUMENT · VERIFY</text>
