<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">Jasjyot | Robotics + AI</title>
  <desc id="desc">Charcoal engineering banner with a technical maze route and abstract robot illustration beside Jasjyot's robotics, autonomous systems, and software interests.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1018"/><stop offset="1" stop-color="#101827"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#42d7ff"/><stop offset="1" stop-color="#4b83ff"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#8092aa" stroke-opacity=".075" stroke-width="1"/></pattern>
    <filter id="blueglow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="frame"><rect x="18" y="18" width="1164" height="374" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect x="18" y="18" width="1164" height="374" rx="22" fill="url(#bg)"/>
    <rect x="18" y="18" width="1164" height="374" fill="url(#grid)"/>
    <path d="M605 18V392" stroke="#a6b6c8" stroke-opacity=".16"/>
    <path d="M18 83H1182" stroke="#a6b6c8" stroke-opacity=".13"/>
    <circle cx="49" cy="51" r="4" fill="#ff6d77"/><circle cx="65" cy="51" r="4" fill="#f3bb53"/><circle cx="81" cy="51" r="4" fill="#42d7ff"/>
    <text x="104" y="56" fill="#9aacbf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.6">FIELD NOTES <tspan fill="#586b82">/ ROBOTICS + AI</tspan></text>
    <text x="52" y="113" fill="#4bd8ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="2">NAVIGATION STUDY <tspan fill="#71849b">· ABSTRACT DIAGRAM</tspan></text>
    <!-- Maze route and sensing geometry -->
    <g fill="none" stroke="#74859a" stroke-opacity=".47" stroke-width="2">
      <path d="M66 147H167V186H119V225H205V264H153V303H250V344"/>
      <path d="M167 147H263V186H227M205 225H290V264H252M250 303H328V344"/>
      <path d="M66 147V225M119 186V264M153 264V303M263 147V170M290 225V246"/>
    </g>
    <path d="M81 326V204H153V285H205V243H275" fill="none" stroke="url(#blue)" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 8" filter="url(#blueglow)">
      <animate attributeName="stroke-dashoffset" values="0;-52" dur="5.5s" repeatCount="indefinite"/>
    </path>
    <g fill="#61dcff"><circle cx="81" cy="326" r="4"/><circle cx="81" cy="204" r="4"/><circle cx="153" cy="204" r="4"/><circle cx="153" cy="285" r="4"/><circle cx="205" cy="285" r="4"/><circle cx="205" cy="243" r="4"/><circle cx="275" cy="243" r="4"/></g>
    <g transform="translate(410 238)" stroke="#4d9cff" stroke-width="2" fill="#111c2a">
      <path d="M0-47V-63M-28-30L-42-43M28-30L42-43" fill="none" stroke-linecap="round"/>
      <circle cx="0" cy="-65" r="3" fill="#51dcff" stroke="none"><animate attributeName="opacity" values=".35;1;.35" dur="3s" repeatCount="indefinite"/></circle>
      <rect x="-43" y="-29" width="86" height="67" rx="17"/>
      <path d="M-43-8H-56V17H-43M43-8H56V17H43" fill="none"/>
      <circle cx="-16" cy="-3" r="5" fill="#52dfff" stroke="none" filter="url(#blueglow)"/><circle cx="16" cy="-3" r="5" fill="#52dfff" stroke="none" filter="url(#blueglow)"/>
      <path d="M-13 18Q0 28 13 18" fill="none" stroke="#52dfff" stroke-linecap="round"/>
      <rect x="-28" y="38" width="56" height="28" rx="8" fill="#111c2a"/><path d="M-19 66V74M19 66V74"/>
    </g>
    <circle cx="410" cy="238" r="93" fill="none" stroke="#4c96ff" stroke-opacity=".22" stroke-dasharray="2 9"><animateTransform attributeName="transform" type="rotate" from="0 410 238" to="360 410 238" dur="34s" repeatCount="indefinite"/></circle>
    <text x="52" y="374" fill="#8fa1b6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">SENSE <tspan fill="#4bd8ff">→</tspan> PLAN <tspan fill="#4bd8ff">→</tspan> ACT</text>
    <text x="347" y="354" fill="#4bd8ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1">MOBILE ROBOT / CONCEPT</text>
    <!-- Identity panel -->
    <text x="651" y="121" fill="#5cdfff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2.2">ROBOTICS + AI <tspan fill="#52677e">/ STUDENT INTERESTS</tspan></text>
    <text x="646" y="190" fill="#f3f7fc" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="58" font-weight="650" letter-spacing="-2">Jasjyot</text>
    <text x="651" y="226" fill="#c3d0df" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Autonomous systems, embedded robotics</text>
    <text x="651" y="252" fill="#c3d0df" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">and software development.</text>
    <rect x="651" y="275" width="86" height="3" rx="1.5" fill="url(#blue)"/>
    <text x="651" y="315" fill="#8498ae" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5">PYTHON · C++ · ARDUINO · EV3 · OPENCV</text>
    <text x="651" y="344" fill="#aebed0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Navigation  /  sensing  /  computer vision</text>
    <text x="651" y="366" fill="#70849a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.4">BUILD · DOCUMENT · VERIFY</text>
  </g>
</svg>
